<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nila Icon Generator — Full Moon</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 40px; background: #111427; color: #e8eaff; }
  h1   { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  p    { font-size: 13px; color: #4b5563; margin-bottom: 32px; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 32px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #374151; }
  canvas { border-radius: 22%; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  button { padding: 12px 28px; background: #828ef2; color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:hover { opacity: 0.9; }
</style>
</head>
<body>
<h1>Nila — Full Moon Icon</h1>
<p>Preview below. Click Download to save all sizes → move files to <code>public/icons/</code></p>

<p style="font-size:11px;color:#374151;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.8px;font-weight:700;">Dark — Indigo</p>
<div class="row" id="previewsDark" style="margin-bottom:28px;"></div>
<p style="font-size:11px;color:#374151;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.8px;font-weight:700;">Light — Sage</p>
<div class="row" id="previewsLight" style="margin-bottom:28px;background:rgba(240,247,243,0.06);padding:16px;border-radius:16px;"></div>
<button onclick="downloadAll()">Download all icons</button>

<script>
const ICONS = [
  { file: 'apple-touch-icon.png',       size: 180, bg: '#111427', accent: [130,142,242], group: 'Dark'  },
  { file: 'apple-touch-icon-light.png', size: 180, bg: '#f0f7f3', accent: [22,163,74],   group: 'Light' },
];

function drawMoon(canvas, bg, accent) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  const cx = s / 2, cy = s / 2;
  const sc = s / 100; // scale: SVG is 100×100

  // Background
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, s, s);

  // Outer glow ring
  ctx.beginPath();
  ctx.arc(cx, cy, 30 * sc, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(${accent},0.10)`;
  ctx.fill();

  // Mid glow ring
  ctx.beginPath();
  ctx.arc(cx, cy, 23 * sc, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(${accent},0.18)`;
  ctx.fill();

  // Moon disc
  ctx.beginPath();
  ctx.arc(cx, cy, 17 * sc, 0, Math.PI * 2);
  ctx.fillStyle = `rgb(${accent})`;
  ctx.fill();

  // Subtle craters
  const bgArr = bg === '#f0f7f3' ? '240,247,243' : '17,20,39';
  [[-6, -4, 3, 0.14],[6, 4, 2, 0.11],[0, -9, 1.5, 0.09]].forEach(([dx, dy, r, a]) => {
    ctx.beginPath();
    ctx.arc(cx + dx * sc, cy + dy * sc, r * sc, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${bgArr},${a})`;
    ctx.fill();
  });
}

const canvases = {};

ICONS.forEach(cfg => {
  const c = document.createElement('canvas');
  c.width = cfg.size; c.height = cfg.size;
  drawMoon(c, cfg.bg, cfg.accent.join(','));
  canvases[cfg.file] = c;

  const preview = document.createElement('canvas');
  const ps = Math.min(cfg.size, 72);
  preview.width = cfg.size; preview.height = cfg.size;
  drawMoon(preview, cfg.bg, cfg.accent.join(','));
  preview.style.width  = ps + 'px';
  preview.style.height = ps + 'px';

  const col = document.createElement('div');
  col.className = 'col';
  col.innerHTML = `<div class="lbl">${cfg.size}px</div>`;
  col.appendChild(preview);

  const container = document.getElementById(cfg.group === 'Dark' ? 'previewsDark' : 'previewsLight');
  container.appendChild(col);
});

function downloadAll() {
  ICONS.forEach((cfg, i) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.download = cfg.file;
      a.href = canvases[cfg.file].toDataURL('image/png');
      a.click();
    }, i * 250);
  });
}
</script>
</body>
</html>
